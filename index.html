<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Map Planner</title>
    <link rel="stylesheet" href="./styles.css">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script defer src="./geo.js"></script>
    <script defer src="./app.js"></script>
</head>
<body>
<header class="app-header">
    <div>
        <h1>Customer Map Planner</h1>
        <p>Excel 거래처 데이터를 지도에 배치하고 클러스터링하여 A4로 출력하는 업무 도구</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
</header>

<div id="measure-box" aria-hidden="true"></div>

<main class="wrapper">
    <aside class="panel" aria-label="지도 설정">
        <section class="box">
            <h2>1. 지도 활성화</h2>
            <label for="apiKeyInput" class="hint">Kakao JavaScript 키</label>
            <div class="row">
                <input type="text" id="apiKeyInput" autocomplete="off" placeholder="Kakao JavaScript 키">
                <button type="button" id="initMapButton">활성화</button>
            </div>
            <label for="originAddressInput" class="hint">기준 주소 (선택)</label>
            <input type="text" id="originAddressInput" placeholder="예: 서울특별시 중구 세종대로 110">
            <p class="hint">키와 기준 주소는 저장소에 저장하지 않습니다. Kakao Developers에서 사용 도메인을 제한해 사용하세요.</p>
        </section>

        <section class="box">
            <h2>2. 거래처 Excel 불러오기</h2>
            <input type="file" id="excelFile" accept=".xlsx,.xls">
            <p class="hint">첫 번째 시트에 <strong>거래처명</strong>, <strong>주소</strong> 컬럼이 필요합니다. 빈 행과 완전 중복 행은 자동 제외합니다.</p>
        </section>

        <section class="box">
            <h2>3. 거래처 검색</h2>
            <input type="text" id="searchInput" placeholder="거래처명 검색" autocomplete="off">
            <div id="searchList" class="list"></div>
        </section>

        <section class="box">
            <h2>4. 지도 표시 목록</h2>
            <div id="selectedList" class="list"></div>
            <button type="button" id="printButton" class="print">A4 가로 인쇄</button>
        </section>
    </aside>

    <section id="map-wrap" aria-label="거래처 지도">
        <div id="map"></div>
        <canvas id="line-canvas"></canvas>
        <div id="label-canvas"></div>
    </section>
</main>
</body>
</html>
