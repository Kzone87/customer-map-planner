<!doctype html><html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="description" content="서로 다른 Excel/CSV의 컬럼명을 표준 양식에 맞게 바꾸고 결과파일로 내려받는 브라우저 작업도구"/><title>컬럼 맞추기 · Customer Data Workbench V3</title><link rel="stylesheet" href="/src/product-ui.css"/></head><body>
<header class="mapping-header"><div><p>Customer Data Workbench · V3</p><h1>컬럼 맞추기</h1><span>업체마다 다른 Excel 컬럼명을 우리 표준 양식에 맞게 바꿉니다.</span></div><div class="mapping-actions"><a href="./">← Excel 작업실</a><a href="./compare.html">두 파일 비교 →</a><a href="./batch.html">여러 파일 일괄처리 →</a></div></header>
<main class="mapping-shell"><section class="mapping-card controls"><h2>1. 원본 파일 선택</h2><input id="mappingFile" type="file" accept=".xlsx,.xls,.csv"/><button id="mappingSample" type="button">샘플 파일 열기</button><p id="mappingSource"></p></section><section class="mapping-card controls"><h2>2. 원본 컬럼 → 표준 컬럼 지정</h2><select id="mappingSourceColumn"></select><input id="mappingTargetColumn" placeholder="예: 거래처명 → company" maxlength="120"/><button id="mappingAdd" class="primary" type="button">변환 규칙 추가</button><div id="mappingList"></div><div class="mapping-actions"><button id="mappingApply" class="primary" type="button">컬럼명 변환</button><button id="mappingReset" type="button">원본 복원</button></div><p id="mappingStatus" role="status"></p></section><section class="mapping-card preview"><div class="preview-head"><div><h2>3. 결과 확인</h2><p id="mappingMeta"></p></div><div><button id="mappingCsv" type="button">CSV 저장</button><button id="mappingXlsx" class="primary" type="button">Excel 저장</button></div></div><div class="mapping-table"><table><thead id="mappingHead"></thead><tbody id="mappingBody"></tbody></table></div></section></main><script type="module" src="/src/mapping-main.ts"></script></body></html>
