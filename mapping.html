<!doctype html><html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="description" content="서로 다른 Excel·CSV의 항목 이름을 원하는 양식에 맞게 바꾸고 결과 파일로 내려받는 브라우저 작업도구"/><title>항목 이름 맞추기 · Excel 정리 작업실</title><link rel="stylesheet" href="/src/product-ui.css"/></head><body>
<header class="mapping-header"><div><p>Excel 정리 작업실</p><h1>항목 이름 맞추기</h1><span>업체마다 다른 Excel 항목 이름을 내가 쓰는 이름으로 바꿉니다.</span></div><div class="mapping-actions"><a href="./">← 한 파일 정리</a><a href="./compare.html">두 파일 비교 →</a><a href="./batch.html">여러 파일 한 번에 정리 →</a></div></header>
<main class="mapping-shell"><section class="mapping-card controls"><h2>1. 원본 파일 선택</h2><input id="mappingFile" type="file" accept=".xlsx,.xls,.csv"/><button id="mappingSample" type="button">샘플 파일로 체험</button><p id="mappingSource"></p></section><section class="mapping-card controls"><h2>2. 바꿀 항목 이름 정하기</h2><select id="mappingSourceColumn" aria-label="원본 항목"></select><input id="mappingTargetColumn" placeholder="예: 업체명 → 거래처명" maxlength="120"/><button id="mappingAdd" class="primary" type="button">이름 변경 추가</button><div id="mappingList"></div><div class="mapping-actions"><button id="mappingApply" class="primary" type="button">항목 이름 바꾸기</button><button id="mappingReset" type="button">원본으로 되돌리기</button></div><p id="mappingStatus" role="status"></p></section><section class="mapping-card preview"><div class="preview-head"><div><h2>3. 결과 확인</h2><p id="mappingMeta"></p></div><div><button id="mappingCsv" type="button">CSV 저장</button><button id="mappingXlsx" class="primary" type="button">Excel 저장</button></div></div><div class="mapping-table"><table><thead id="mappingHead"></thead><tbody id="mappingBody"></tbody></table></div></section></main><script type="module" src="/src/mapping-main.ts"></script></body></html>
