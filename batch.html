<!doctype html><html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="description" content="여러 Excel·CSV 파일에 같은 정리 규칙을 한 번에 적용하고 결과를 통합 Excel로 내려받는 작업도구"/><title>여러 파일 한 번에 정리 · Excel 정리 작업실</title><link rel="stylesheet" href="/src/product-ui.css"/></head><body>
<header class="batch-header"><div><p>Excel 정리 작업실</p><h1>여러 파일 한 번에 정리</h1><span>월별·업체별 파일에 같은 정리 기준을 적용하고 결과를 한 번에 확인합니다.</span></div><nav><a href="./">한 파일 정리</a><a href="./mapping.html">항목 이름 맞추기</a><a href="./compare.html">두 파일 비교</a></nav></header>
<main class="batch-shell"><section class="batch-card preset-card"><h2>어떻게 정리할까요?</h2><p>필요한 작업을 체크하고, 검사할 항목 이름을 입력하세요. 입력하지 않은 항목은 건드리지 않습니다.</p><div class="rule-form"><label>작업 이름<input id="presetName" value="거래처 파일 정리" maxlength="80"/></label><fieldset><legend>반복해서 적용할 정리</legend><label class="check-row"><input id="opTrim" type="checkbox" checked/>앞뒤 공백 제거</label><label class="check-row"><input id="opEmail" type="checkbox" checked/>이메일 형식 정리</label><label class="check-row"><input id="opPhone" type="checkbox" checked/>전화번호 형식 정리</label><label class="check-row"><input id="opDedupe" type="checkbox" checked/>중복 행 제거</label></fieldset><div class="two-col"><label>이름을 바꿀 원본 항목<input id="mappingSource" placeholder="예: 업체명" maxlength="120"/></label><label>바꾼 뒤 항목 이름<input id="mappingTarget" placeholder="예: 거래처명" maxlength="120"/></label></div><div class="two-col"><label>비어 있으면 안 되는 항목<input id="requiredColumn" value="거래처명" placeholder="예: 거래처명" maxlength="120"/></label><label>이메일 형식을 확인할 항목<input id="emailColumn" value="이메일" placeholder="예: 이메일" maxlength="120"/></label></div><label>결과에 남길 항목 <span class="hint">비워 두면 모든 항목을 유지합니다.</span><input id="targetColumns" placeholder="예: 거래처명, 이메일, 연락처, 지역, 상태" maxlength="600"/></label></div><p id="presetStatus" class="status" role="status"></p></section><section class="batch-card input-card"><h2>파일을 선택하세요</h2><input id="batchFiles" type="file" accept=".xlsx,.xls,.csv" multiple/><p class="muted">선택한 파일은 서버로 전송하지 않고 현재 브라우저 안에서만 처리합니다.</p><div class="button-row"><button id="runBatch" class="primary" type="button">선택한 파일 정리하기</button><button id="sampleBatch" type="button">샘플 3개로 바로 체험</button></div><div class="progress-track"><div id="progressBar"></div></div><p id="batchStatus" class="status" role="status"></p></section><section class="batch-card summary-card"><h2>처리 결과</h2><div class="metrics"><article><span>전체 파일</span><strong id="metricTotal">0</strong></article><article><span>정상 완료</span><strong id="metricSuccess">0</strong></article><article><span>확인 필요</span><strong id="metricValidation">0</strong></article><article><span>처리 실패</span><strong id="metricError">0</strong></article></div><div class="button-row"><button id="reportCsv" type="button" disabled>처리 결과 CSV 저장</button><button id="combinedXlsx" class="primary" type="button" disabled>정상 파일 하나로 합치기</button></div></section><section class="batch-card table-card"><div class="table-wrap"><table><thead><tr><th>파일</th><th>처리 상태</th><th>행 수</th><th>확인할 항목</th><th>안내</th></tr></thead><tbody id="resultBody"></tbody></table></div></section></main><script type="module" src="/src/batch-main.ts"></script></body></html>
