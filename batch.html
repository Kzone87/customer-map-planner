<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="여러 Excel·CSV 파일에 같은 정리 규칙을 한 번에 적용하고 파일별 결과와 통합 Excel을 내려받는 작업도구"><title>여러 파일 한 번에 정리 | Excel 정리 작업실</title><link rel="stylesheet" href="/src/product-ui.css"></head><body>
<header class="batch-header"><div><h1>여러 파일 한 번에 정리</h1><span>월별·업체별 파일에 같은 정리 작업을 반복하지 않고 한 번에 처리합니다.</span></div><nav><a href="./">Excel 정리</a><a href="./mapping.html">컬럼 이름 맞추기</a><a href="./compare.html">두 파일 비교</a></nav></header>
<main class="batch-shell">
<section class="batch-card preset-card"><h2>1. 어떤 식으로 정리할까요?</h2><p>파일에 들어 있는 거래처명·이메일·연락처 컬럼의 이름을 입력하고 적용할 정리 작업을 선택하세요.</p><div class="batch-settings"><label>거래처명 컬럼<input id="companyColumn" value="거래처명" maxlength="80"></label><label>이메일 컬럼<input id="emailColumn" value="이메일" maxlength="80"></label><label>연락처 컬럼<input id="phoneColumn" value="연락처" maxlength="80"></label></div><div class="clean-options"><label><input id="optTrim" type="checkbox" checked> 앞뒤 공백 제거</label><label><input id="optEmail" type="checkbox" checked> 이메일 형식 정리</label><label><input id="optPhone" type="checkbox" checked> 전화번호 형식 정리</label><label><input id="optDedupe" type="checkbox" checked> 중복 행 제거</label></div><p id="presetStatus" class="status" role="status">기본 정리 설정이 준비되어 있습니다.</p></section>
<section class="batch-card input-card"><h2>2. 처리할 파일을 선택하세요.</h2><input id="batchFiles" type="file" accept=".xlsx,.xls,.csv" multiple><p class="muted">파일은 서버로 보내지 않고 현재 브라우저 안에서만 처리합니다.</p><div class="button-row"><button id="sampleBatch" type="button">샘플 3개로 바로 체험</button><button id="runBatch" class="primary" type="button">선택한 파일 일괄 정리</button></div><div class="progress-track"><div id="progressBar"></div></div><p id="batchStatus" class="status" role="status"></p></section>
<section class="batch-card summary-card"><h2>3. 처리 결과</h2><div class="metrics"><article><span>전체 파일</span><strong id="metricTotal">0</strong></article><article><span>정상 완료</span><strong id="metricSuccess">0</strong></article><article><span>확인 필요</span><strong id="metricValidation">0</strong></article><article><span>처리 실패</span><strong id="metricError">0</strong></article></div><div class="button-row"><button id="reportCsv" type="button" disabled>파일별 결과 CSV</button><button id="combinedXlsx" class="primary" type="button" disabled>정상 결과 한 Excel로 받기</button></div></section>
<section class="batch-card table-card"><div class="table-wrap"><table><thead><tr><th>파일</th><th>결과</th><th>처리 행</th><th>확인할 항목</th><th>메모</th></tr></thead><tbody id="resultBody"></tbody></table></div></section>
</main><script type="module" src="/src/batch-main.ts"></script></body></html>
