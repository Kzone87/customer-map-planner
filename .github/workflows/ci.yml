name: ci

on:
  push:
    branches: [ main, "test/**", "refactor/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: |
          node --check geo.js
          node --check app.js
      - name: Run geospatial regression tests
        run: node --test
