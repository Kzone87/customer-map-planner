name: deploy-pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install
      - run: npm test
      - run: npm run build:delivery
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  wait-for-branch-pages:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Wait for branch-based Pages build to release deployment slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=30" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment")][0] | if . == null then "missing|" else (.status + "|" + (.conclusion // "")) end')
            status="${state%%|*}"
            conclusion="${state#*|}"
            echo "Branch Pages deployment: ${status} ${conclusion} (attempt ${attempt})"
            if [ "$status" = "completed" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for branch Pages build to release the deployment slot" >&2
          exit 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, wait-for-branch-pages]
    steps:
      - name: Deploy Vite dist to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
