name: deploy-pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for branch-based Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in {1..24}; do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=20" \
              --jq '.workflow_runs[] | select(.name == "pages build and deployment") | .status' | head -n 1)
            if [ -z "$status" ] || [ "$status" = "completed" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for branch Pages build" >&2
          exit 1
      - name: Deploy Vite dist to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
